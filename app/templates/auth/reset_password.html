{% extends "auth/auth_base.html" %}
{% block title %}Set new password — {{ app_name }}{% endblock %}
{% block auth_content %}
<h1 class="auth-title">Choose a new password</h1>
<p class="auth-sub">Your reset link is valid for a limited time and can only be used once.</p>

<form data-api="/api/v1/auth/reset-password" method="post" novalidate>
  <input type="hidden" name="token" value="{{ token }}">
  <div class="form-group mb-2">
    <label class="form-label" for="password">New password</label>
    <input class="input" type="password" id="password" name="password" placeholder="Min. 8 characters" required autocomplete="new-password" data-pw-meter="#pwMeter3">
    <div class="pw-meter" id="pwMeter3"><i></i></div>
  </div>
  <div class="form-group mb-2">
    <label class="form-label" for="password_confirm">Confirm new password</label>
    <input class="input" type="password" id="password_confirm" name="password_confirm" placeholder="Repeat password" required autocomplete="new-password">
  </div>
  <button type="submit" class="btn btn-primary btn-block btn-lg">Save new password</button>
</form>

<div class="auth-switch"><a href="{{ url_for('auth.login_page') }}">← Back to login</a></div>
{% endblock %}
