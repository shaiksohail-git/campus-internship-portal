{% extends "auth/auth_base.html" %}
{% block title %}Forgot password — {{ app_name }}{% endblock %}
{% block auth_content %}
<h1 class="auth-title">Reset your password</h1>
<p class="auth-sub">Enter your account email and we'll send you a secure reset link.</p>

<form data-api="/api/v1/auth/forgot-password" method="post" novalidate>
  <div class="form-group mb-2">
    <label class="form-label" for="email">Email address</label>
    <input class="input" type="email" id="email" name="email" placeholder="you@college.edu" required autocomplete="email">
  </div>
  <button type="submit" class="btn btn-primary btn-block btn-lg">Send reset link</button>
</form>

<div class="auth-switch"><a href="{{ url_for('auth.login_page') }}">← Back to login</a></div>
{% endblock %}
